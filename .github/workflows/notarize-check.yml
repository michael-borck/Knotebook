name: Notarize check

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notarize-check
  cancel-in-progress: true

jobs:
  notarize-check:
    runs-on: macos-latest
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target

      - run: npm ci

      - name: Require Apple credentials
        shell: bash
        run: |
          missing=0
          for name in \
            APPLE_CERTIFICATE \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_SIGNING_IDENTITY \
            APPLE_API_KEY \
            APPLE_API_ISSUER \
            APPLE_API_KEY_CONTENT
          do
            if [ -z "${!name}" ]; then
              echo "::error::Missing $name. Sync secrets with app-hq/scripts/sync-apple-secrets.sh."
              missing=1
            fi
          done
          exit $missing

      - name: Write App Store Connect key
        shell: bash
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$APPLE_API_KEY_CONTENT" |
            openssl base64 -d -A > ~/.appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY}.p8

      - name: Build, sign and notarize
        run: npx tauri build --target aarch64-apple-darwin --bundles dmg

      - name: Verify signature and notarization
        shell: bash
        run: |
          DMG=$(ls src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg | head -1)
          MNT=$(mktemp -d)
          trap 'hdiutil detach "$MNT" >/dev/null 2>&1 || true' EXIT
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$MNT" >/dev/null
          APP="$MNT/Knotebook.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          spctl --assess --type execute --verbose=4 "$APP"
          xcrun stapler validate "$APP"
          ls -lh "$DMG"
