name: Release desktop

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: michael-borck/actions/.github/workflows/tauri-release.yml@main
    secrets: inherit
    with:
      product-name: Knotebook
      preflight-command: npm run typecheck && npm run lint && npm run smoke
      updater: true
