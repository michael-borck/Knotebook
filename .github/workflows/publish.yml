name: Publish app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-app
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build app (relative base)
        run: npm run build
        env:
          PAGES_BASE: ./
      - name: Assemble site
        run: |
          mkdir -p _site/app
          cp -R landing/. _site/
          cp -R dist/. _site/app/
          touch _site/.nojekyll
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SITE_SSH_KEY }}
      - name: Trust github.com
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts
      - name: Publish to site repo
        run: |
          git clone --depth 1 git@github.com:michael-borck/knotebook-site.git site
          rm -rf site/assets site/icons site/app
          rm -f \
            site/index.html \
            site/manifest.webmanifest \
            site/sw.js \
            site/favicon.svg \
            site/icons.svg \
            site/catalogue.json \
            site/sample.knotebook.json \
            site/.nojekyll
          cp -R _site/. site/
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "deploy: ${GITHUB_SHA::7}"
            git push
          else
            echo "No changes to publish."
          fi
