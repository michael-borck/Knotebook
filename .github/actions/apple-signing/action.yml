name: Apple API signing
description: Validate Apple credentials and install the App Store Connect API key for notarization.

# Expected environment (set at the job level):
#   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
#   APPLE_TEAM_ID, APPLE_API_KEY, APPLE_API_ISSUER, APPLE_API_KEY_CONTENT
#
# Tauri (and Electron's notarytool hook) look for the .p8 under
# ~/.appstoreconnect/private_keys. The certificate is consumed by the bundler.

runs:
  using: composite
  steps:
    - name: Require Apple credentials
      shell: bash
      run: |
        missing=0
        for name in \
          APPLE_CERTIFICATE \
          APPLE_CERTIFICATE_PASSWORD \
          APPLE_SIGNING_IDENTITY \
          APPLE_TEAM_ID \
          APPLE_API_KEY \
          APPLE_API_ISSUER \
          APPLE_API_KEY_CONTENT
        do
          if [ -z "${!name}" ]; then
            echo "::error::Missing $name. Sync secrets with app-hq/scripts/sync-apple-secrets.sh."
            missing=1
          fi
        done
        exit $missing

    - name: Write App Store Connect API key
      shell: bash
      run: |
        mkdir -p ~/.appstoreconnect/private_keys
        printf '%s' "$APPLE_API_KEY_CONTENT" |
          openssl base64 -d -A > ~/.appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY}.p8
